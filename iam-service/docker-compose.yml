version: '3.8'

services:
  # Сервис базы данных PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: iam-postgres
    environment:
      POSTGRES_USER: iamuser
      POSTGRES_PASSWORD: iampassword
      POSTGRES_DB: iamdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d/  # Автоматическое выполнение миграций
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iamuser -d iamdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iam-network

  # Ваше Go-приложение
  iam-service:
    build: .
    container_name: iam-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=iamuser
      - DB_PASSWORD=iampassword
      - DB_NAME=iamdb
      - DB_SSL_MODE=disable
    ports:
      - "8080:8080"
    networks:
      - iam-network

# Docker volumes
volumes:
  postgres_data:

# Docker networks
networks:
  iam-network:
    driver: bridge